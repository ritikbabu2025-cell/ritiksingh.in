<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Ritik Singh</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .contact-page {
      min-height: 100vh;
      padding: 120px 20px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-wrapper {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 50px;
      align-items: center;
    }

    .contact-info h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .contact-info p {
      color: #aaa;
      font-size: 17px;
      line-height: 1.7;
      max-width: 450px;
    }

    .contact-details {
      margin-top: 35px;
    }

    .contact-detail {
      margin-bottom: 20px;
    }

    .contact-detail span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-detail a {
      color: #fff;
      text-decoration: none;
    }

    .contact-form {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 35px;
      backdrop-filter: blur(10px);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: rgba(255,255,255,0.4);
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 15px 25px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #form-message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #6ee7b7;
    }

    .error {
      color: #f87171;
    }

    @media (max-width: 768px) {
      .contact-page {
        padding: 100px 20px 50px;
      }

      .contact-wrapper {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .contact-form {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="contact-page">

    <div class="contact-wrapper">

      <div class="contact-info">
        <h1>Let's<br>Talk.</h1>

        <p>
          Have a project in mind or want to work together?
          Send me a message and I'll get back to you as soon as possible.
        </p>

        <div class="contact-details">

          <div class="contact-detail">
            <span>Email</span>
            <a href="mailto:ritikbabu2025@gmail.com">
              ritikbabu2025@gmail.com
            </a>
          </div>

          <div class="contact-detail">
            <span>Available For</span>
            <div>Freelance & Collaborations</div>
          </div>

        </div>
      </div>


      <form id="contactForm" class="contact-form">

        <div class="form-row">

          <div class="form-group">
            <label for="name">Name *</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
            >
          </div>

        </div>


        <div class="form-row">

          <div class="form-group">
            <label for="phone">Phone</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+91 XXXXX XXXXX"
            >
          </div>

          <div class="form-group">
            <label for="subject">Subject *</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="Project enquiry"
              required
            >
          </div>

        </div>


        <div class="form-group">
          <label for="message">Message *</label>

          <textarea
            id="message"
            name="message"
            placeholder="Tell me about your project..."
            required
          ></textarea>
        </div>


        <button type="submit" class="submit-btn" id="submitBtn">
          Send Message
        </button>

        <div id="form-message"></div>

      </form>

    </div>

  </main>


  <script>
    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("form-message");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      button.disabled = true;
      button.textContent = "Sending...";
      message.textContent = "";
      message.className = "";

      const formData = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        message: document.getElementById("message").value.trim()
      };

      try {

        const response = await fetch("/api/contact", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong");
        }

        message.textContent = "Message sent successfully! I'll get back to you soon.";
        message.className = "success";

        form.reset();

      } catch (error) {

        message.textContent =
          error.message || "Unable to send message. Please try again.";

        message.className = "error";

      } finally {

        button.disabled = false;
        button.textContent = "Send Message";

      }

    });
  </script>

</body>
</html>
